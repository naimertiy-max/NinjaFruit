<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🍉 Fruta Ninja</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score">0</div>
    <div id="lives">❤️❤️❤️</div>
  </div>

  <!-- Tela inicial -->
  <div id="startScreen">
    <h1>🍉 Fruta Ninja</h1>
    <p>Arraste o mouse (ou o dedo) para cortar as frutas.</p>
    <p>Não deixe as frutas caírem e <strong>evite as bombas 💣</strong></p>
    <button id="startBtn">Começar</button>
  </div>

  <!-- Tela de fim de jogo -->
  <div id="overlay" class="hidden">
    <h1>Fim de Jogo</h1>
    <p id="finalScore">Pontuação: 0</p>
    <button id="restart">Jogar de novo</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
